version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5050:5000"  # Host:Container
    expose:
      - "5000"
    environment:
      - PORT=5000  # Ensures the backend listens on port 5000

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_BASE_URL=http://backend:5000
    ports:
      - "3000:80"
    depends_on:
      - backend
